server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Next.js가 내보낸 해시 파일은 장기 캐시가 안전하다.
    # expires와 add_header를 함께 쓰면 Cache-Control이 중복 전송되므로 하나로 합친다.
    location /_next/static/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # Next.js export는 /projects/foo -> projects/foo.html 로 내보내면서
    # 같은 이름의 디렉터리(RSC payload)도 함께 만든다. 디렉터리보다 .html을 먼저 찾아야 한다.
    location / {
        try_files $uri.html $uri $uri/index.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }
}
