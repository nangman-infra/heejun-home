<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta
      name="description"
      content="Backend와 Cloud 기술을 중심으로 문제를 해결하고 서비스를 만드는 개발자 전희준의 포트폴리오입니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="전희준 | Backend & Cloud Developer" />
    <meta
      property="og:description"
      content="Backend와 Cloud 기술을 중심으로 문제를 해결하고 서비스를 만드는 개발자 전희준의 포트폴리오입니다."
    />
    <title>전희준 | Backend &amp; Cloud Developer</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>

    <header class="site-header">
      <div class="container navigation">
        <a class="logo" href="#top" aria-label="전희준 포트폴리오 홈">HJ<span>.</span></a>
        <button
          class="menu-button"
          type="button"
          aria-expanded="false"
          aria-controls="primary-navigation"
        >
          Menu
        </button>
        <nav id="primary-navigation" class="navigation-links" aria-label="주요 메뉴"></nav>
      </div>
    </header>

    <main id="main-content">
      <section id="top" class="hero container" aria-labelledby="hero-title">
        <p class="eyebrow" id="hero-role"></p>
        <h1 id="hero-title"></h1>
        <div id="hero-introduction" class="hero-introduction"></div>
        <div class="hero-actions">
          <a class="button button-primary" href="#projects">View Projects</a>
          <a class="button button-secondary" id="hero-github" href="#">GitHub</a>
        </div>
      </section>

      <div class="container content-sections">
        <section id="about" class="section" aria-labelledby="about-title">
          <div class="section-heading">
            <p class="section-label">About</p>
            <h2 id="about-title"></h2>
          </div>
          <div id="about-content" class="about-content"></div>
        </section>

        <section id="projects" class="section" aria-labelledby="projects-title">
          <div class="section-heading">
            <p class="section-label">Selected work</p>
            <h2 id="projects-title">Projects</h2>
            <p>프로젝트에서 맡은 역할과 해결한 문제를 중심으로 정리했습니다.</p>
          </div>
          <div id="project-list" class="project-grid"></div>
        </section>

        <section id="experience" class="section" aria-labelledby="experience-title">
          <div class="section-heading">
            <p class="section-label">Background</p>
            <h2 id="experience-title">Experience</h2>
          </div>
          <div id="experience-list" class="experience-list"></div>
        </section>

        <section id="contact" class="section contact-section" aria-labelledby="contact-title">
          <div class="section-heading">
            <p class="section-label">Get in touch</p>
            <h2 id="contact-title">Contact</h2>
            <p>함께할 기회나 프로젝트에 관한 이야기를 기다립니다.</p>
          </div>
          <dl id="contact-list" class="contact-list"></dl>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <span>© <span id="current-year"></span> 전희준</span>
        <a href="#top">Back to top ↑</a>
      </div>
    </footer>
  </body>
</html>
